<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Internal Planning Calendar</title>
<style>
:root{
  --ink:#1b1b1f; --mut:#6b7280; --line:#e5e7eb; --bg:#f6f7f9; --card:#fff;
  --accent:#0f6cbd; --warn:#b45309; --danger:#b91c1c; --ok:#15803d;

  /* 화면 크기 — body.ui-* 로 전환. JS가 같은 값을 읽어 행 높이를 계산한다. */
  --lane-h:30px;    /* 막대 한 줄이 차지하는 높이 */
  --bar-h:26px;     /* 막대 자체 높이 */
  --bar-fs:13px;
  --row-top:34px;   /* 날짜 숫자 영역 */
  --row-min:98px;   /* 일정 없는 주의 최소 높이 */
  --row-pad:6px;
  --dnum:24px;
  --fs:15px;
  --maxw:1440px;
  --backlog-h:200px;
  --hol-h:15px;
}
body.ui-sm{
  --lane-h:26px; --bar-h:22px; --bar-fs:12px; --row-top:30px;
  --row-min:84px; --dnum:21px; --fs:14px; --maxw:1240px; --backlog-h:188px; --hol-h:14px;
}
body.ui-lg{
  --lane-h:36px; --bar-h:31px; --bar-fs:14.5px; --row-top:38px;
  --row-min:120px; --dnum:27px; --fs:16.5px; --maxw:1720px; --backlog-h:228px; --hol-h:17px;
}
body.ui-xl{
  --lane-h:43px; --bar-h:37px; --bar-fs:16.5px; --row-top:44px;
  --row-min:146px; --dnum:31px; --fs:18px; --maxw:2040px; --backlog-h:264px; --hol-h:19px;
}
/* 인쇄 직전에만 붙는다. 화면 크기 설정과 무관하게 출력을 일정하게 만든다. */
body.printing,body.printing.ui-sm,body.printing.ui-lg,body.printing.ui-xl{
  --lane-h:26px; --bar-h:22px; --bar-fs:12px; --row-top:30px;
  --row-min:84px; --dnum:21px; --fs:14px; --maxw:none; --hol-h:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Malgun Gothic",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); font-size:var(--fs);
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--card);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.qnav{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid var(--line)}
.qlabel{font-weight:700;font-size:15px;min-width:132px;text-align:center}
.mlabel{font-weight:600;min-width:128px;text-align:center;color:var(--mut)}
.nav{
  width:30px;height:30px;border:1px solid var(--line);background:#fff;
  border-radius:7px;line-height:1;font-size:16px;
}
.nav:hover{background:#f0f3f7;border-color:#c9d3e0}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 11px;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:7px 12px;font-size:13px;
}
.btn:hover{background:#f0f3f7}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger);border-color:#f3c9c9}
.spacer{flex:1}
.sync{font-size:12px;color:var(--mut);white-space:nowrap}
.sync.bad{color:var(--danger)}
.sync.good{color:var(--ok)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{
  border:0;background:transparent;padding:8px 14px;font-size:13px;
  border-bottom:2px solid transparent;color:var(--mut)
}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ---------- menu ---------- */
.menu{
  position:absolute; right:16px; top:52px; z-index:60; width:300px;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.14); padding:12px;
}
.menu h4{margin:0 0 7px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.menu hr{border:0;border-top:1px solid var(--line);margin:11px 0}
.menu .chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:3px 10px;font-size:12px;opacity:.42
}
.chip.on{opacity:1}
.menu input[type=search]{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px}
.uisize{display:flex;align-items:center;gap:10px}
.uisize span{flex:1;text-align:center;font-size:13px;font-weight:600}
.uisize button{width:34px;padding:4px 0;font-size:15px;line-height:1}
.uisize button:disabled{opacity:.35;cursor:default}
.menu .row{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- calendar ---------- */
.wrap{padding:16px;max-width:var(--maxw);margin:0 auto}
.monthblock{margin-bottom:22px}
.monthhead{font-weight:700;font-size:calc(var(--fs) + 1px);margin:0 0 8px;padding-left:2px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);background:#fafbfc;border-bottom:1px solid var(--line)}
.dow div{padding:7px 0;text-align:center;font-size:calc(var(--fs) - 2px);color:var(--mut);font-weight:600}
.dow div:first-child,.dow div:last-child{color:#9aa3af}
.week{position:relative;border-bottom:1px solid var(--line)}
.week:last-child{border-bottom:0}
.daycells{display:grid;grid-template-columns:repeat(7,1fr);height:100%;position:absolute;inset:0}
.daycell{border-right:1px solid var(--line);position:relative}
.daycell:last-child{border-right:0}
.daycell.off{background:#fcfcfd}
.daycell.we{background:#fdfdfe}
.daycell.hol{background:#fff6f6}
.daycell.today .dnum{background:var(--accent);color:#fff;border-radius:50%}
.daycell.blackout::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(180,83,9,.11) 0 6px,transparent 6px 12px);
}
.daycell.dense{background:rgba(15,108,189,.07)}
.daycell.dense2{background:rgba(15,108,189,.14)}
.daycell.rec{box-shadow:inset 0 0 0 2px #15803d}
.daycell.over{background:rgba(15,108,189,.17)}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);position:relative;pointer-events:none}
.dnum{
  font-size:calc(var(--fs) - 2px);color:var(--mut);
  width:var(--dnum);height:var(--dnum);line-height:var(--dnum);
  text-align:center;margin:5px 0 0 5px;position:relative;z-index:2
}
.dnum.red{color:#c2334d;font-weight:700}
.holname{
  font-size:calc(var(--fs) - 4px);color:#c2334d;line-height:var(--hol-h);height:var(--hol-h);
  margin:0 4px 0 5px;position:relative;z-index:2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.lanes{position:relative;padding:0 3px 5px;pointer-events:none}
.bar{
  position:absolute;height:var(--bar-h);line-height:var(--bar-h);border-radius:5px;
  font-size:var(--bar-fs);padding:0 8px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;cursor:grab;pointer-events:auto;z-index:3;
  border:1px solid transparent;
}
.bar.tbc{background:#fff !important;border-style:dashed;opacity:.75;font-weight:400}
.cb{
  display:inline-block;margin-right:5px;padding:0 4px;
  font-size:calc(var(--bar-fs) - 3px);font-weight:700;
  letter-spacing:.03em;border-radius:3px;
  border:1px solid currentColor;background:transparent;
  opacity:.5;vertical-align:1px;line-height:1.5;
}
.card .cb{flex:none;opacity:.45}
.btn.retry{background:#fef2f2;border-color:#fecaca;color:#b91c1c;font-weight:600}
.bar:active{cursor:grabbing}
.bar .nd{opacity:.65;font-weight:700;margin-left:3px}
.emptyrow{height:var(--row-min)}

/* ---------- backlog ---------- */
.backlog{
  position:sticky;bottom:0;z-index:30;background:var(--card);
  border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.05);
}
.blhead{
  display:flex;align-items:center;gap:9px;padding:8px 16px;
  border-bottom:1px solid var(--line);font-size:13px;
}
.blhead b{font-size:13px}
.lanesrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px 12px;max-height:var(--backlog-h);overflow:auto}
.lane{background:#fafbfc;border:1px dashed var(--line);border-radius:9px;padding:8px;min-height:62px}
.lane.over{background:#eef4fb;border-color:var(--accent)}
.lane h5{margin:0 0 7px;font-size:calc(var(--fs) - 3px);color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{
  background:#fff;border:1px dashed #cbd5e1;border-radius:7px;
  padding:6px 9px;margin-bottom:5px;font-size:var(--bar-fs);cursor:grab;
  display:flex;align-items:center;gap:6px;
}
.card:active{cursor:grabbing}
.card .dot{width:8px;height:8px;border-radius:50%;flex:none}
.card .mo{color:var(--mut);font-size:calc(var(--fs) - 3px);margin-left:auto;flex:none}
.collapsed .lanesrow{display:none}

/* ---------- board / list ---------- */
.board{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
.board th,.board td{border:1px solid var(--line);padding:8px;vertical-align:top;font-size:12.5px}
.board th{background:#fafbfc;font-size:12px;color:var(--mut);position:sticky;top:0}
.board td.cat{background:#fafbfc;font-weight:600;white-space:nowrap;width:130px}
.bitem{border-radius:5px;padding:3px 7px;margin-bottom:4px;font-size:12px;cursor:pointer}
.bitem.tbc{background:#fff !important;border:1px dashed #cbd5e1;opacity:.8}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list th,.list td{border-bottom:1px solid var(--line);padding:9px 11px;text-align:left;font-size:13px}
.list th{background:#fafbfc;font-size:12px;color:var(--mut)}
.list tr:last-child td{border-bottom:0}
.list .note{color:var(--mut);font-size:11.5px;margin-top:2px}
.pill{border-radius:999px;padding:2px 9px;font-size:11.5px;white-space:nowrap}
.mhead td{background:#f3f5f8;font-weight:700;font-size:12px}

/* ---------- modal ---------- */
.back{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.26)}
.modal.wide{max-width:600px}
.mtop{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mtop h3{margin:0;font-size:15px;flex:1}
.mbody{padding:16px}
.mfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
label.f input,label.f select,label.f textarea{
  width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.det dt{font-size:11.5px;color:var(--mut);margin-top:9px}
.det dd{margin:2px 0 0;font-size:13.5px}
.det ul{margin:4px 0 0 17px;padding:0;font-size:13px}
.meta{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
.bolist{font-size:13px}
.bolist div{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.bolist span{flex:1}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#1f2937;color:#fff;border-radius:9px;padding:10px 14px;font-size:13px;
  box-shadow:0 8px 22px rgba(0,0,0,.26);display:flex;align-items:center;gap:11px;max-width:560px
}
.toast.warn{background:#92400e}
.toast.err{background:#991b1b}
.toast ul{margin:4px 0 0 16px;padding:0;font-size:12px;opacity:.92}
.toast button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;white-space:nowrap}
.banner{background:#fef3c7;color:#92400e;padding:8px 16px;font-size:12.5px;border-bottom:1px solid #fde68a}
.hidden{display:none !important}

/* ---------- print ---------- */
@media print{
  .topbar,.tabs,.backlog,.menu,.toasts,.banner,.no-print{display:none !important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .monthblock{break-inside:avoid;margin-bottom:14px}
  .cal{border-color:#999}
  .bar{box-shadow:none}
  @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>

<div class="banner hidden" id="banner"></div>

<div class="topbar">
  <div class="qnav">
    <button class="nav" id="qPrev" title="이전 분기">‹</button>
    <span class="qlabel" id="qLabel">—</span>
    <button class="nav" id="qNext" title="다음 분기">›</button>
  </div>
  <button class="nav" id="mPrev" title="이전 달">‹</button>
  <span class="mlabel" id="mLabel">—</span>
  <button class="nav" id="mNext" title="다음 달">›</button>
  <div class="seg" id="modeSeg">
    <button data-mode="quarter" class="on">3개월</button>
    <button data-mode="single">1개월</button>
  </div>
  <div class="spacer"></div>
  <span class="sync" id="syncMsg">로컬 데이터</span>
  <button class="btn sm retry hidden" id="retryBtn" title="저장하지 못한 변경을 다시 올립니다">다시 저장</button>
  <button class="btn pri" id="addBtn">＋ 일정 추가</button>
  <button class="btn" id="menuBtn" title="더보기">⋯</button>
</div>

<div class="tabs">
  <button data-view="cal" class="on">캘린더</button>
  <button data-view="board">분기 보드</button>
  <button data-view="list">리스트</button>
</div>

<div class="menu hidden" id="menu">
  <h4>검색</h4>
  <input type="search" id="q" placeholder="제목·메모·카테고리…" />
  <hr/>
  <h4>Solution Area</h4>
  <div class="chips" id="tagChips"></div>
  <h4 style="margin-top:10px">카테고리</h4>
  <div class="chips" id="catChips"></div>
  <label class="f" style="flex-direction:row;align-items:center;gap:7px;margin-top:9px">
    <input type="checkbox" id="catBadgeTgl" style="width:auto;margin:0" />
    <span style="font-size:12.5px;color:#374151">카테고리 배지 표시 <span style="color:#9aa3af">(칸이 좁으면 자동 숨김)</span></span>
  </label>
  <hr/>
  <h4>화면 크기</h4>
  <div class="uisize">
    <button class="btn sm" id="uiDown" title="작게">−</button>
    <span id="uiLabel">보통</span>
    <button class="btn sm" id="uiUp" title="크게">+</button>
  </div>
  <hr/>
  <div class="row">
    <button class="btn sm" id="blBtn">블랙아웃 관리</button>
    <button class="btn sm" id="icsBtn">Outlook(.ics)</button>
    <button class="btn sm" id="printBtn">인쇄 / PDF</button>
  </div>
  <hr/>
  <div class="row">
    <button class="btn sm" id="ghBtn">GitHub 연결</button>
    <button class="btn sm" id="newQBtn">다음 분기 만들기</button>
  </div>
</div>

<div class="wrap">
  <div id="viewCal"></div>
  <div id="viewBoard" class="hidden"></div>
  <div id="viewList" class="hidden"></div>
</div>

<div class="backlog" id="backlog">
  <div class="blhead">
    <b>날짜 미정</b>
    <span class="sync" id="blCount"></span>
    <span class="spacer"></span>
    <span class="sync">카드를 날짜 칸으로 끌어다 놓으면 확정됩니다</span>
    <button class="btn sm" id="blToggle">접기</button>
  </div>
  <div class="lanesrow" id="lanesRow">
    <div class="lane" data-prec="month"><h5>월중</h5><div class="laneitems" id="laneMonth"></div></div>
    <div class="lane" data-prec="quarter"><h5>분기 상시</h5><div class="laneitems" id="laneQuarter"></div></div>
    <div class="lane" data-prec="tbc"><h5>미정</h5><div class="laneitems" id="laneTbc"></div></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script id="seed" type="application/json">{
  "currentQuarter": "PENDING",
  "tags": {},
  "categories": [],
  "quarters": [
    {
      "id": "PENDING",
      "label": "데이터를 불러오는 중…",
      "periodStart": "2026-10-01",
      "periodEnd": "2026-12-31",
      "months": [
        "2026-10",
        "2026-11",
        "2026-12"
      ],
      "blackouts": [],
      "events": []
    }
  ]
}</script>
<script>
"use strict";

/* ============================================================
   상태
   ============================================================ */
var D = JSON.parse(document.getElementById("seed").textContent);
var qi = 0;                       // 현재 분기 index
var monthCursor = 0;              // 분기 내 월 index (1개월 모드)
var mode = "quarter";
var view = "cal";
var filters = { tags:null, cats:null, q:"" };
var drag = null;                  // {id, days, from}
var undoStack = [];
var gh = { pat:"", owner:"janeeyye", repo:"marketing-calendar-internal", path:"calendar-data.json", branch:"main" };
var fileSha = null, lastCommit = null, saveTimer = null, busyEditing = false, pendingRemote = false;
var dirty = false, retryTimer = null, retryN = 0;
var RETRY_WAIT = [5000, 15000, 40000, 90000];
var showCat = true;

/* ============================================================
   유틸
   ============================================================ */
function $(id){ return document.getElementById(id); }
var UI_SIZES=["ui-sm","","ui-lg","ui-xl"];
var UI_NAMES=["조밀","보통","크게","아주 크게"];
var uiSize=1, booted=false;
function uiPx(name){
  var v=parseFloat(getComputedStyle(document.body).getPropertyValue(name));
  return isNaN(v) ? 0 : v;
}
function applyUiSize(n, persist){
  uiSize=Math.min(UI_SIZES.length-1, Math.max(0, n));
  UI_SIZES.forEach(function(c){ if(c) document.body.classList.remove(c); });
  if(UI_SIZES[uiSize]) document.body.classList.add(UI_SIZES[uiSize]);
  var lab=$("uiLabel"); if(lab) lab.textContent=UI_NAMES[uiSize];
  var dn=$("uiDown"), up=$("uiUp");
  if(dn) dn.disabled = uiSize<=0;
  if(up) up.disabled = uiSize>=UI_SIZES.length-1;
  if(persist){ try{ localStorage.setItem("mci.ui", String(uiSize)); }catch(_){ } }
  if(booted) render();
}
function applyCatBadge(on, persist){
  showCat=!!on;
  var cb=$("catBadgeTgl"); if(cb) cb.checked=showCat;
  if(persist){ try{ localStorage.setItem("mci.catbadge", showCat?"1":"0"); }catch(_){ } }
  if(booted) render();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parse(s){ var a=String(s).split("-").map(Number); return new Date(a[0],a[1]-1,a[2]); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
function todayISO(){ return iso(new Date()); }
function uid(){ return "ev-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
function Q(){ return D.quarters[qi]; }
function quarterIndexFor(d){
  if(!d) return -1;
  for(var i=0;i<D.quarters.length;i++){
    var q=D.quarters[i];
    if(q.periodStart && q.periodEnd && d>=q.periodStart && d<=q.periodEnd) return i;
  }
  return -1;
}
function gotoQuarter(i){
  qi=i;
  monthCursor=0;
}
function endOf(e){ return e.end || e.start; }
function isDay(e){ return e.precision === "day"; }
var TAG_STYLE={

function spanDays(start, span){

function toast(msg, opt){
  opt = opt || {};
  var el = document.createElement("div");
  el.className = "toast" + (opt.kind ? " "+opt.kind : "");
  var html = "<div><div>"+esc(msg)+"</div>";
  if(opt.list && opt.list.length){
    html += "<ul>"+opt.list.map(function(x){ return "<li>"+esc(x)+"</li>"; }).join("")+"</ul>";
  }
  html += "</div>";
  el.innerHTML = html;
  if(opt.undo){
    var b=document.createElement("button"); b.textContent="되돌리기";
    b.onclick=function(){ opt.undo(); el.remove(); };
    el.appendChild(b);
  }
  $("toasts").appendChild(el);
  setTimeout(function(){ el.remove(); }, opt.ms || (opt.undo ? 9000 : 4200));
  return el;
}
function snapshot(e){

function restore(s){
  var e = Q().events.filter(function(x){ return x.id===s.id; })[0];
  if(!e) return;
  e.precision=s.precision; e.start=s.start; e.end=s.end;

/* ============================================================
   슬로팅 판단 — 드래그 중에만 사용
   ============================================================ */
function blackouts(){ return Q().blackouts || []; }
function inBlackout(day){
  return blackouts().some(function(b){ return day>=b.start && day<=b.end; });
}
function blackoutName(day){
  var b = blackouts().filter(function(b){ return day>=b.start && day<=b.end; })[0];
  return b ? b.label : "";
}
function densityByWeek(){
  var m = {};
  Q().events.forEach(function(e){
    if(!isDay(e)) return;
    var n = diffDays(e.start, endOf(e));
    for(var i=0;i<=n;i++){
      var k = weekKey(addDays(e.start,i));
      m[k] = (m[k]||0)+1;
    }
  });
  return m;
}
/** 해당 날짜에 놓았을 때의 경고 목록 */
function conflicts(ev, start, span){
  var out = [];
  var days = spanDays(start, span);
  var bo = days.filter(inBlackout)[0];
  if(bo) out.push("블랙아웃 구간: " + blackoutName(bo));
  var hol = days.filter(isHoliday);
  if(hol.length){
    out.push("공휴일: " + holidayName(hol[0]) + (hol.length>1 ? " 외 "+(hol.length-1)+"일" : ""));
  }
  var wk = weekKey(start);
  var sameTag = Q().events.filter(function(x){
    return x.id!==ev.id && isDay(x) && x.tag===ev.tag && weekKey(x.start)===wk;
  });
  if(sameTag.length) out.push("같은 주에 " + ev.tag + " 일정 " + sameTag.length + "건 (" + sameTag[0].title + ")");
  var near = Q().events.filter(function(x){
    return x.id!==ev.id && isDay(x) && x.category===ev.category &&
           Math.abs(diffDays(x.start, start))<=3;
  });
  if(near.length) out.push("3일 이내 같은 카테고리: " + near[0].title);
  return out;
}
function recommended(ev, span){
  var ok = {};
  var days = quarterDays();
  days.forEach(function(d){
    var w = parse(d).getDay();
    if(w===0||w===6) return;
    if(conflicts(ev, d, span).length) return;
    ok[d]=1;
  });
  return ok;
}
function quarterDays(){
  var out=[], d=parse(Q().periodStart), end=parse(Q().periodEnd);
  while(d<=end){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}

/* ============================================================
   캘린더 렌더
   ============================================================ */
function weeksOf(ym){
  var a=ym.split("-").map(Number);
  var first=new Date(a[0],a[1]-1,1), last=new Date(a[0],a[1],0);
  var start=new Date(first); start.setDate(1-first.getDay());
  var end=new Date(last); end.setDate(last.getDate()+(6-last.getDay()));
  var weeks=[], cur=new Date(start);
  while(cur<=end){
    var w=[];
    for(var i=0;i<7;i++){ w.push(iso(cur)); cur.setDate(cur.getDate()+1); }
    weeks.push(w);
  }
  return weeks;
}
/** 한 주에 걸치는 이벤트를 레인으로 배치 */
function layout(week, evs){
  var ws=week[0], we=week[6], segs=[];
  evs.forEach(function(e){
    if(!isDay(e)) return;
    var s=e.start, en=endOf(e);
    if(en<ws || s>we) return;
    var from=s<ws?ws:s, to=en>we?we:en;
    segs.push({ e:e, col:diffDays(ws,from), span:diffDays(from,to)+1,
                headless:s<ws, tailless:en>we });
  });
  segs.sort(function(a,b){
    if(a.col!==b.col) return a.col-b.col;
    return b.span-a.span;
  });
  var lanes=[];
  segs.forEach(function(sg){
    var li=0;
    while(true){
      lanes[li]=lanes[li]||[];
      var clash=lanes[li].some(function(o){ return !(sg.col+sg.span<=o.col || o.col+o.span<=sg.col); });
      if(!clash){ lanes[li].push(sg); sg.lane=li; break; }
      li++;
    }
  });
  return { segs:segs, laneCount:lanes.length };
}

function renderMonth(ym, dens, recs){
  var weeks=weeksOf(ym), evs=events();
  var LH=uiPx("--lane-h"), TOP=uiPx("--row-top"), MIN=uiPx("--row-min"),
      PAD=uiPx("--row-pad"), HOL=uiPx("--hol-h");
  var h='<div class="monthblock"><h3 class="monthhead">'+monthName(ym)+'</h3><div class="cal">';
  h+='<div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>';
  weeks.forEach(function(w){
    var L=layout(w,evs);
    var top = TOP + (w.some(isHoliday) ? HOL : 0);
    var rowH=Math.max(MIN, top + L.laneCount*LH + PAD);
    h+='<div class="week" style="height:'+rowH+'px">';
    h+='<div class="daycells">';
    w.forEach(function(d){
      var cls="daycell";
      if(d.slice(0,7)!==ym) cls+=" off";
      var wd=parse(d).getDay();
      if(wd===0||wd===6) cls+=" we";
      var hn=holidayName(d);
      if(hn) cls+=" hol";
      if(d===todayISO()) cls+=" today";
      if(drag){
        if(inBlackout(d)) cls+=" blackout";
        var c=dens[weekKey(d)]||0;
        if(c>=5) cls+=" dense2"; else if(c>=3) cls+=" dense";
        if(recs && recs[d]) cls+=" rec";
      }
      h+='<div class="'+cls+'" data-day="'+d+'"></div>';
    });
    h+='</div>';
    h+='<div class="weekgrid">';
    w.forEach(function(d){
      var hn=holidayName(d);
      var wd=parse(d).getDay();
      var red=(hn || wd===0);
      h+='<div><div class="dnum'+(red?" red":"")+'">'+Number(d.slice(8,10))+'</div>'
       + (hn?'<div class="holname">'+esc(hn)+'</div>':'')
       + '</div>';
    });
    h+='</div>';
    h+='<div class="lanes" style="height:'+(L.laneCount*LH)+'px">';
    L.segs.forEach(function(sg){
      var e=sg.e, t=tagOf(e.tag);
      var left="calc("+(sg.col/7*100)+"% + 3px)";
      var width="calc("+(sg.span/7*100)+"% - 6px)";
      var top=(sg.lane*LH)+"px";
      var style="left:"+left+";width:"+width+";top:"+top+";background:"+t.color+";color:"+t.ink+";border-color:"+t.line;
      var nd=(e.notes&&e.notes.length)?'<span class="nd" title="'+esc(e.notes.join(" · "))+'">·</span>':"";
      var pre=sg.headless?"◂ ":"";
      var tip=e.title+"  \u2014  "+(TAG_FULL[e.tag]||e.tag)+"  \u00b7  "+e.category;
      h+='<div class="bar" draggable="true" data-id="'+e.id+'" style="'+style+'" title="'+esc(tip)+'">'
         + (sg.headless?"":catBadge(e)) + pre + esc(e.title) + nd + '</div>';
    });
    h+='</div></div>';
  });
  h+='</div></div>';
  return h;
}

function fitBadges(){
  var bars=document.querySelectorAll("#viewCal .bar");
  var i, cb, keep=[];
  for(i=0;i<bars.length;i++){
    cb=bars[i].querySelector(".cb");
    if(cb){ cb.style.display=""; keep.push(bars[i]); }
  }
  var m=keep.map(function(b){
    return { cb:b.querySelector(".cb"), w:b.clientWidth, bw:b.querySelector(".cb").offsetWidth };
  });
  m.forEach(function(x){
    if(x.w - x.bw < 52) x.cb.style.display="none";
  });
}

function renderCal(){
  var dens = drag ? densityByWeek() : {};
  var recs = drag ? drag.rec : null;
  var months = mode==="quarter" ? Q().months : [Q().months[monthCursor]];
  $("viewCal").innerHTML = months.map(function(m){ return renderMonth(m, dens, recs); }).join("");
  bindCal();
  fitBadges();
}

/* ============================================================
   드래그 앤 드롭
   ============================================================ */
function startDrag(id){
  var e = Q().events.filter(function(x){ return x.id===id; })[0];
  if(!e) return;
  var span = isDay(e) ? diffDays(e.start, endOf(e)) : 0;
  drag = { id:id, span:span, rec:recommended(e, span) };
  renderCal();
}
function endDrag(){
  if(!drag) return;
  drag = null;
  renderCal();
}
function dropOnDay(id, day){
  var e = Q().events.filter(function(x){ return x.id===id; })[0];
  if(!e) return;
  var span = isDay(e) ? diffDays(e.start, endOf(e)) : 0;
  var before = snapshot(e);
  var warn = conflicts(e, day, span);
  e.precision="day"; e.start=day; e.end=addDays(day, span);
  touch(e);
  render(); scheduleSave();
  toast(e.title + " → " + day + (span?(" ~ "+e.end):""), {
    kind: warn.length ? "warn" : "",
    list: warn,
    undo: function(){ restore(before); }
  });
}
function dropOnLane(id, prec){
  var e = Q().events.filter(function(x){ return x.id===id; })[0];
  if(!e || e.precision===prec) return;
  var before = snapshot(e);
  var ym = (e.start||Q().months[0]).slice(0,7);
  e.precision = prec;
  if(prec==="month"){ e.start = ym+"-01"; e.end = e.start; }
  else { e.start = Q().months[0]+"-01"; e.end = e.start; }
  touch(e);
  render(); scheduleSave();
  toast(e.title + " → " + (prec==="month"?"월중":prec==="quarter"?"분기 상시":"미정"), {
    undo:function(){ restore(before); }
  });
}

function modal(html, cls){
  var back=document.createElement("div");
  back.className="back";
  back.innerHTML='<div class="modal '+(cls||"")+'">'+html+'</div>';
  back.addEventListener("mousedown", function(ev){ if(ev.target===back) close(); });
  $("modalRoot").appendChild(back);
  busyEditing = true;
  function close(){
    back.remove();
    busyEditing = $("modalRoot").children.length>0;
    if(!busyEditing && pendingRemote){ pendingRemote=false; pull(true); }
  }
  back.close = close;
  return back;
}

     e.precision==="quarter" ? "분기 상시" : "미정");

      + '</dl>'

function fmtTime(s){
  if(!s) return "";

  if(isNaN(d)) return s;

}

/* ============================================================
   GitHub 동기화
   ============================================================ */
function api(path, opts){
  opts=opts||{};
  var headers=Object.assign({Accept:"application/vnd.github+json"}, opts.headers||{});
  if(gh.pat) headers.Authorization="Bearer "+gh.pat;
  return fetch("https://api.github.com"+path, Object.assign({}, opts, {headers:headers}))
    .then(function(r){
      return r.text().then(function(txt){
        var json=null; try{ json=JSON.parse(txt); }catch(_){}
        if(!r.ok){ var err=new Error((json&&json.message)||("HTTP "+r.status)); err.status=r.status; throw err; }
        return json;
      });
    });
}
function b64encode(str){
  var bytes=new TextEncoder().encode(str), bin="";
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64decode(b64){
  var bin=atob(String(b64).replace(/\n/g,""));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function connected(){ return !!(gh.pat && gh.owner && gh.repo && gh.path); }
function contentsUrl(){
  return "/repos/"+gh.owner+"/"+gh.repo+"/contents/"+encodeURIComponent(gh.path).replace(/%2F/g,"/");
}
function setSync(msg, kind){
  var el=$("syncMsg");
  el.textContent=msg;
  el.className="sync"+(kind?(" "+kind):"");
}

function pull(loud){
  if(!connected()){ setSync("GitHub 미연결 · 일정 없음"); return Promise.resolve(); }
  if(dirty && loud && !confirm("아직 저장되지 않은 변경이 있습니다.\n\n불러오면 그 변경은 사라집니다. 계속할까요?")) return Promise.resolve();
  setSync("불러오는 중…");
  return api(contentsUrl()+"?ref="+encodeURIComponent(gh.branch))
    .then(function(res){
      fileSha=res.sha;
      var parsed=JSON.parse(b64decode(res.content));
      applyRemote(parsed);
      return latestCommit().then(function(sha){ lastCommit=sha; });
    })
    .then(function(){
      clearTimeout(retryTimer); retryTimer=null; retryN=0;
      setDirty(false);
      setSync("동기화됨 · "+nowHm(), "good");
      if(loud) toast("GitHub에서 불러왔습니다");
      showBanner("");
    })
    .catch(function(err){
      if(err.status===404){
        setSync("파일 없음 — 첫 저장 대기", "bad");
        fileSha=null;
        if(loud) toast("repo에 파일이 없습니다. 수정하면 새로 만들어집니다.", {kind:"warn"});
      } else {
        setSync("연결 실패", "bad");
        if(loud) toast("불러오기 실패: "+err.message, {kind:"err"});
      }
    });
}
function applyRemote(parsed){
  var curId = Q() ? Q().id : null;
  D = parsed;
  var idx = D.quarters.map(function(q){ return q.id; }).indexOf(curId);
  qi = idx>=0 ? idx : Math.max(0, D.quarters.map(function(q){return q.id;}).indexOf(D.currentQuarter));
  if(qi<0) qi=0;
  if(monthCursor >= Q().months.length) monthCursor=0;
  var known={};
  Object.keys(D.tags||{}).forEach(function(k){ known[k]=1; });
  (D.quarters||[]).forEach(function(q){
    (q.events||[]).forEach(function(e){ if(e.tag) known[e.tag]=1; });
  });
  D.tags = D.tags || {};
  Object.keys(known).forEach(function(k){ if(!D.tags[k]) D.tags[k]=tagOf(k); });
  if(filters.tags) filters.tags=null;
  if(filters.cats) filters.cats=null;

  var rescued=0;
  D.quarters.forEach(function(q, i){
    for(var k=q.events.length-1;k>=0;k--){
      var e=q.events[k];
      if(e.precision!=="day") continue;
      var want=quarterIndexFor(e.start);
      if(want>=0 && want!==i){
        q.events.splice(k,1);
        D.quarters[want].events.push(e);
        rescued++;
      }
    }
  });

  renderChips();
  render();
  if(rescued) toast(rescued+"건의 일정이 분기와 맞지 않아 올바른 분기로 옮겼습니다. 아무 일정이나 수정하면 저장됩니다.", {kind:"warn"});
}
function latestCommit(){
  return api("/repos/"+gh.owner+"/"+gh.repo+"/commits?path="+encodeURIComponent(gh.path)
             +"&sha="+encodeURIComponent(gh.branch)+"&per_page=1")
    .then(function(a){ return (a&&a[0])?a[0].sha:null; })
    .catch(function(){ return null; });
}

function setDirty(on){
  dirty=!!on;
  var b=$("retryBtn");
  if(b) b.classList.toggle("hidden", !dirty);
}
function scheduleSave(){
  setDirty(true);
  clearTimeout(retryTimer); retryTimer=null; retryN=0;
  if(!connected()){ setSync("로컬 전용 — 변경됨 (GitHub 미연결)", "bad"); return; }
  setSync("변경됨…");
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){ saveTimer=null; push(); }, 2000);
}
function push(){
  if(!connected()) return;
  setSync("저장 중…");
  var payload=JSON.stringify(serialize(), null, 2);
  var body={ message:"캘린더 업데이트", content:b64encode(payload), branch:gh.branch };
  if(fileSha) body.sha=fileSha;
  return api(contentsUrl(), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) })
    .then(function(res){
      fileSha=res.content.sha;
      lastCommit=res.commit.sha;
      clearTimeout(retryTimer); retryTimer=null; retryN=0;
      setDirty(false);
      setSync("저장됨 · "+nowHm(), "good");
    })
    .catch(function(err){
      if(err.status===409 || err.status===422){ conflictFlow(); return; }
      setDirty(true);
      var perm=(err.status===403 || err.status===404 || err.status===401);
      if(perm){
        setSync("저장 실패 — 권한 확인 필요", "bad");
        toast("저장 실패: "+err.message+" — 토큰의 Contents 권한이 Read and write 인지 확인하세요. 변경은 보관해 두었습니다.", {kind:"err"});
        return;
      }
      var wait=RETRY_WAIT[Math.min(retryN, RETRY_WAIT.length-1)];
      retryN++;
      setSync("저장 실패 — "+Math.round(wait/1000)+"초 후 재시도", "bad");
      if(retryN===1) toast("저장 실패: "+err.message+" — 자동으로 다시 시도합니다.", {kind:"err"});
      clearTimeout(retryTimer);
      retryTimer=setTimeout(function(){ retryTimer=null; push(); }, wait);
    });
}
function serialize(){
  D.currentQuarter = Q().id;
  return D;
}
function conflictFlow(){
  setSync("충돌 — 확인 필요", "bad");
  var mine = JSON.parse(JSON.stringify(D));
  api(contentsUrl()+"?ref="+encodeURIComponent(gh.branch)).then(function(res){
    var theirs = JSON.parse(b64decode(res.content));
    fileSha = res.sha;
    var h='<div class="mtop"><h3>다른 사람이 먼저 수정했습니다</h3></div><div class="mbody">'
      + '<p style="margin:0 0 10px;font-size:13.5px">그 사이 다른 팀원이 저장했습니다. 어떻게 할까요?</p>'
      + '<ul style="margin:0 0 4px 18px;padding:0;font-size:13px;color:#6b7280">'
      + '<li><b>내 변경 다시 적용</b> — 최신본 위에 내 내용을 덮어씁니다</li>'
      + '<li><b>최신본 받기</b> — 내 변경을 버리고 다른 사람 내용을 가져옵니다</li>'
      + '</ul></div>'
      + '<div class="mfoot"><button class="btn" id="cTheirs">최신본 받기</button>'
      + '<button class="btn pri" id="cMine">내 변경 다시 적용</button></div>';
    var m=modal(h);
    m.querySelector("#cTheirs").onclick=function(){ m.close(); applyRemote(theirs); setDirty(false); setSync("최신본 적용됨 · "+nowHm(), "good"); };
    m.querySelector("#cMine").onclick=function(){ m.close(); D=mine; render(); push(); };
  }).catch(function(err){
    toast("충돌 처리 실패: "+err.message, {kind:"err"});
  });
}
function poll(){
  if(!connected() || saveTimer || dirty) return;
  latestCommit().then(function(sha){
    if(!sha || sha===lastCommit) return;
    if(busyEditing || drag || dirty){ pendingRemote=true; return; }
    lastCommit=sha;
    pull(false).then(function(){ toast("다른 팀원의 변경을 반영했습니다"); });
  });
}
function nowHm(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function showBanner(msg){
  var b=$("banner");
  if(!msg){ b.classList.add("hidden"); return; }
  b.textContent=msg; b.classList.remove("hidden");
}

/* ============================================================
   .ics
   ============================================================ */
function exportIcs(){
  var all = confirm("미정·월중 항목까지 전부 포함할까요?\n\n[확인] 전부  /  [취소] 날짜 확정분만");
  var rows=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Internal Planning Calendar//KR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  var stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  Q().events.forEach(function(e){
    if(!isDay(e) && !all) return;
    var s=(e.start||Q().months[0]+"-01").replace(/-/g,"");
    var en=addDays(isDay(e)?endOf(e):(e.start||Q().months[0]+"-01"),1).replace(/-/g,"");
    var desc=["Solution Area: "+e.tag,"Category: "+e.category];
    if(e.owner) desc.push("담당: "+e.owner);
    if(e.notes&&e.notes.length){ desc.push(""); e.notes.forEach(function(n){ desc.push("- "+n); }); }
    if(!isDay(e)) desc.push("","※ 날짜가 확정되지 않아 임시 배치된 항목입니다.");
    rows.push("BEGIN:VEVENT","UID:"+e.id+"@internal-cal","DTSTAMP:"+stamp,
      "DTSTART;VALUE=DATE:"+s,"DTEND;VALUE=DATE:"+en,
      "SUMMARY:"+ics(e.title),"DESCRIPTION:"+ics(desc.join("\n")),
      "CATEGORIES:"+ics(e.category),"TRANSP:TRANSPARENT","END:VEVENT");
  });
  rows.push("END:VCALENDAR");
  var blob=new Blob([rows.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=Q().id+".ics"; a.click();
  URL.revokeObjectURL(a.href);
}
function ics(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }

/* ============================================================
   분기 전환
   ============================================================ */
function nextQuarterOf(q){
  var last=q.months[q.months.length-1].split("-").map(Number);
  var y=last[0], m=last[1];
  var months=[];
  for(var i=0;i<3;i++){
    m++; if(m>12){ m=1; y++; }
    months.push(y+"-"+pad(m));
  }
  var fy = Number(q.id.replace(/\D+/g,"").slice(0,2));
  var qn = Number((q.id.match(/Q(\d)/)||[0,1])[1]);
  qn++; if(qn>4){ qn=1; fy++; }
  var id="FY"+fy+"-Q"+qn;
  var endM=months[2].split("-").map(Number);
  return {
    id:id, label:"Korea | FY"+fy+" Q"+qn,
    periodStart:months[0]+"-01",
    periodEnd:iso(new Date(endM[0],endM[1],0)),
    months:months, source:"", blackouts:[], events:[]
  };
}
function createNextQuarter(){
  var cur=Q();
  var nq=nextQuarterOf(cur);
  if(D.quarters.some(function(q){ return q.id===nq.id; })){
    toast(nq.id+" 는 이미 있습니다"); return;
  }
  var always=cur.events.filter(function(e){ return e.precision==="quarter"; });
  var stuck=cur.events.filter(function(e){ return e.precision==="month"||e.precision==="tbc"; });
  var msg=nq.label+" 를 만듭니다.\n\n· 분기 상시 "+always.length+"건은 자동 복사됩니다.";
  var carry=false;
  if(stuck.length){
    carry=confirm(msg+"\n· 이번 분기에서 날짜를 못 잡은 "+stuck.length+"건을 이월할까요?\n\n[확인] 이월  /  [취소] 이월 안 함");
  } else {
    if(!confirm(msg)) return;
  }
  always.forEach(function(e){
    var c=JSON.parse(JSON.stringify(e));
    c.id=uid(); c.start=nq.periodStart; c.end=nq.periodEnd;
    nq.events.push(c);
  });
  if(carry){
    stuck.forEach(function(e){
      var c=JSON.parse(JSON.stringify(e));
      c.id=uid(); c.precision="tbc"; c.start=nq.months[0]+"-01"; c.end=c.start;
      nq.events.push(c);
    });
  }
  D.quarters.push(nq);
  qi=D.quarters.length-1; monthCursor=0;
  render(); scheduleSave();
  toast(nq.label+" 생성됨 · "+nq.events.length+"건 복사");
}

/* ============================================================
   렌더 / 바인딩
   ============================================================ */
function render(){
  var q=Q();
  $("qLabel").textContent=q.label;
  $("qPrev").disabled = qi<=0;
  $("qNext").disabled = qi>=D.quarters.length-1;
  $("mLabel").textContent = mode==="quarter"
    ? (monthName(q.months[0])+" – "+Number(q.months[2].split("-")[1])+"월")
    : monthName(q.months[monthCursor]);
  $("mPrev").style.visibility = mode==="quarter" ? "hidden":"visible";
  $("mNext").style.visibility = mode==="quarter" ? "hidden":"visible";
  if(view==="cal") renderCal();
  if(view==="board") renderBoard();
  if(view==="list") renderList();
  renderBacklog();
}
function renderChips(){
  var th=Object.keys(D.tags).map(function(t){
    var on=!filters.tags||filters.tags.has(t);
    var c=tagOf(t);
    return '<button class="chip'+(on?" on":"")+'" data-tag="'+esc(t)+'" title="'+esc(TAG_FULL[t]||t)+'" style="background:'+(on?c.pill:c.color)+';color:'+(on?"#fff":c.ink)+';border-color:'+c.line+'">'+esc(t)+'</button>';
  }).join("");
  $("tagChips").innerHTML=th;
  $("catChips").innerHTML=D.categories.map(function(c){
    var on=!filters.cats||filters.cats.has(c);
    return '<button class="chip'+(on?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  }).join("");
  Array.prototype.forEach.call($("tagChips").children, function(b){
    b.onclick=function(){ toggle("tags", Object.keys(D.tags), b.dataset.tag); };
  });
  Array.prototype.forEach.call($("catChips").children, function(b){
    b.onclick=function(){ toggle("cats", D.categories, b.dataset.cat); };
  });
}
function toggle(key, all, val){
  if(!filters[key]) filters[key]=new Set(all);
  if(filters[key].has(val)) filters[key].delete(val); else filters[key].add(val);
  if(filters[key].size===all.length) filters[key]=null;
  renderChips(); render();
}

$("qPrev").onclick=function(){ if(qi>0){ qi--; monthCursor=0; render(); } };
$("qNext").onclick=function(){ if(qi<D.quarters.length-1){ qi++; monthCursor=0; render(); } };
$("mPrev").onclick=function(){ if(monthCursor>0){ monthCursor--; render(); } };
